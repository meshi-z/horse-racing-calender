name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_latest:
        description: 'Fetch and checkout latest origin/main HEAD'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: 'firebase-hosting'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Test & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure latest remote HEAD
        if: inputs.checkout_latest == true
        run: |
          git fetch origin main
          git checkout -B main origin/main
          echo "Checked out latest origin/main at: $(git rev-parse HEAD)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run unit & integration tests
        run: npm run test

      - name: Build production bundle
        run: npm run build

      - name: Deploy to Firebase Hosting (Live)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HORSE_RACING_CALENDAR || secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: horse-racing-calendar
