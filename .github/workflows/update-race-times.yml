name: Update Confirmed Race Times

on:
  schedule:
    # 木曜日 (出馬表発表目安 16:00すぎ) -> 30分後, 1時間後, 2時間後
    - cron: '30 7 * * 4'   # 16:30 JST
    - cron: '0 8 * * 4'    # 17:00 JST
    - cron: '0 9 * * 4'    # 18:00 JST
    # 金曜日 (確定枠順発表目安 10:00すぎ) -> 30分後, 1時間後, 2時間後
    - cron: '30 1 * * 5'   # 10:30 JST
    - cron: '0 2 * * 5'    # 11:00 JST
    - cron: '0 3 * * 5'    # 12:00 JST
    # 土曜日 (土曜当日朝 07:30 JST / 日曜前日夕方 17:30 JST)
    - cron: '30 22 * * 5'  # 土曜 07:30 JST (金曜 22:30 UTC)
    - cron: '30 8 * * 6'   # 土曜 17:30 JST
    # 日曜日 (日曜当日朝 07:30 JST)
    - cron: '30 22 * * 6'  # 日曜 07:30 JST (土曜 22:30 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update even if all races are already confirmed'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: 'update-race-times'
  cancel-in-progress: false

jobs:
  update-times:
    name: Fetch & Update Race Times
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run update-race-times script
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            npm run data:update-times -- --force
          else
            npm run data:update-times
          fi

      - name: Commit and push changes if any
        run: |
          if git diff --quiet public/data/races.json; then
            echo "No race data changes detected. Nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/races.json
            git commit -m "chore(data): update confirmed race times from JRA racecard" -m "Co-authored-by: Antigravity <antigravity@example.com>"
            git push origin main
          fi
