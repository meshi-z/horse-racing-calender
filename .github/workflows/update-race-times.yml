name: Update Confirmed Race Times

on:
  schedule:
    # 毎日朝 07:30 JST (当日開催レースの最終確認・アメリカ競馬結果/当日確定確認・天候等順延検知)
    - cron: '30 22 * * *'  # 毎日 22:30 UTC = 07:30 JST
    # 平日昼 12:30 JST (NAR昼間開催直前・当日確定確認)
    - cron: '30 3 * * 1-5' # 月〜金 03:30 UTC = 12:30 JST
    # 平日〜土曜夕方 17:30 JST (NARナイター開催直前・翌日以降出馬表更新、JRA土曜前日夕方)
    - cron: '30 8 * * 1-6' # 月〜土 08:30 UTC = 17:30 JST
    # 毎日夜 21:30 JST (フランス・イギリス・アメリカ競馬・海外重賞開催直前確認)
    - cron: '30 12 * * *'  # 毎日 12:30 UTC = 21:30 JST
    # 木曜日 (JRA出馬表発表目安 16:00すぎ) -> 30分後, 1時間後, 2時間後
    - cron: '30 7 * * 4'   # 木曜 16:30 JST
    - cron: '0 8 * * 4'    # 木曜 17:00 JST
    - cron: '0 9 * * 4'    # 木曜 18:00 JST
    # 金曜日 (JRA確定枠順発表目安 10:00すぎ) -> 30分後, 1時間後, 2時間後
    - cron: '30 1 * * 5'   # 金曜 10:30 JST
    - cron: '0 2 * * 5'    # 金曜 11:00 JST
    - cron: '0 3 * * 5'    # 金曜 12:00 JST
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update even if all races are already confirmed'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: 'update-race-times'
  cancel-in-progress: false

jobs:
  update-times:
    name: Fetch & Update Race Times
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run update-race-times script
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            npm run data:update-times -- --force
          else
            npm run data:update-times
          fi

      - name: Commit and push changes if any
        run: |
          if git diff --quiet public/data/races.json; then
            echo "No race data changes detected. Nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/races.json
            git commit -m "chore(data): update confirmed race times from official racecards" -m "Co-authored-by: Antigravity <antigravity@example.com>"
            git push origin main
          fi
