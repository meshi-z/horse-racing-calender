name: Deploy Legacy GitHub Pages Redirect

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/generate-pages-redirect.ts'
      - 'scripts/lib/pages-redirect.ts'
      - '.github/workflows/deploy-pages-redirect.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages-redirect'
  cancel-in-progress: false

jobs:
  build-redirect:
    name: Build 4-Language Redirect Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate redirect bundle
        run: npm run pages:build-redirect

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages/

  deploy-redirect:
    name: Deploy Redirect to GitHub Pages
    needs: build-redirect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
