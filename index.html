<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#047B5F" />
    <title>Graded Races Calendar | Schedule of World Graded Races</title>
    <meta name="description" content="Comprehensive schedule and confirmed race times for graded horse racing worldwide." />
    <meta name="keywords" content="horse racing, race calendar, graded races, JRA, NAR, BHA, France Galop, Equibase, HKJC, HRI, G1" />
    <link rel="canonical" href="https://meshi-z.github.io/horse-racing-calender/" />

    <!-- OGP (Open Graph Protocol) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://meshi-z.github.io/horse-racing-calender/" />
    <meta property="og:site_name" content="Graded Races Calendar" />
    <meta property="og:title" content="Graded Races Calendar | Schedule of World Graded Races" />
    <meta property="og:description" content="Comprehensive schedule and confirmed race times for graded horse racing worldwide." />
    <meta property="og:image" content="https://meshi-z.github.io/horse-racing-calender/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Graded Races Calendar Logo" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ja_JP" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="zh_HK" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Graded Races Calendar | Schedule of World Graded Races" />
    <meta name="twitter:description" content="Comprehensive schedule and confirmed race times for graded horse racing worldwide." />
    <meta name="twitter:image" content="https://meshi-z.github.io/horse-racing-calender/icons/icon-512.png" />

    <!-- PWA / Apple Mobile Web -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Graded Races" />
    <meta name="application-name" content="Graded Races" />

    <!-- Structured Data (Schema.org JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "重賞カレンダー",
        "alternateName": [
          "Graded Races Calendar",
          "JRA & NAR Graded Races Calendar",
          "中央・地方 重賞カレンダー",
          "Calendrier des Courses de Groupe",
          "分級賽行事曆",
          "香港・日本・歐美重賞賽程"
        ],
        "url": "https://meshi-z.github.io/horse-racing-calender/",
        "description": "JRA（中央競馬）およびNAR（地方競馬・ダートグレード・ばんえい）、フランス競馬（France Galop）、イギリス競馬（BHA）、アメリカ競馬（Equibase）、香港競馬（HKJC）、アイルランド競馬（HRI）の全重賞レース日程・確定発走時刻・出走条件を網羅したオフライン対応Webカレンダー。日英仏・繁体字中国語多言語対応。",
        "applicationCategory": "SportsApplication",
        "operatingSystem": "All",
        "inLanguage": ["ja", "en", "fr", "zh-HK"],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>

    <!-- Dark Mode Theme Initialization (Prevents FOUC) -->
    <script>
      (function() {
        try {
          var key = 'horse-racing-calendar-theme';
          var stored = localStorage.getItem(key);
          var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches) || (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- PWA App Name Language Initialization (Syncs apple-mobile-web-app-title before React mounts) -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('language');
          var lang = (stored || navigator.language || '').toLowerCase();
          var title = 'Graded Races';
          if (lang.indexOf('ja') === 0) {
            title = '重賞カレンダー';
          } else if (lang.indexOf('fr') === 0) {
            title = 'Courses de Groupe';
          } else if (lang.indexOf('zh') === 0) {
            title = '分級賽行事曆';
          }
          var appleTitleMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (appleTitleMeta) {
            appleTitleMeta.setAttribute('content', title);
          }
          var appNameMeta = document.querySelector('meta[name="application-name"]');
          if (appNameMeta) {
            appNameMeta.setAttribute('content', title);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
